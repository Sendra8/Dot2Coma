name: CallBridge – exe de Windows y APK

on:
  workflow_dispatch:
  push:
    paths:
      - "callbridge/**"
      - ".github/workflows/callbridge-windows.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: callbridge/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk CallBridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CallBridge-android
          path: callbridge/android/CallBridge.apk

  windows:
    needs: apk
    runs-on: windows-latest
    defaults:
      run:
        working-directory: callbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CallBridge-android
          path: callbridge/callbridge/android
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          pip install llama-cpp-python --prefer-binary --only-binary=llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Pruebas
        run: python -m pytest -q tests
      - name: Empaquetar
        run: pyinstaller --noconfirm CallBridge.spec
      - name: Prueba de humo del exe
        shell: pwsh
        run: |
          $env:CALLBRIDGE_HOME = "$env:RUNNER_TEMP\cbhome"
          $p = Start-Process -FilePath dist\CallBridge\CallBridge.exe -ArgumentList "--no-open","--port","8799" -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-RestMethod -Uri http://127.0.0.1:8799/api/bridge
          Stop-Process -Id $p.Id
          if (-not $r.running) { Write-Error "El puente no arrancó"; exit 1 }
          if (-not $r.apk) { Write-Error "La APK no está incluida"; exit 1 }
          Write-Output "Puente OK en el puerto $($r.port); APK incluida"
      - uses: actions/upload-artifact@v4
        with:
          name: CallBridge-windows
          path: callbridge/dist/CallBridge
