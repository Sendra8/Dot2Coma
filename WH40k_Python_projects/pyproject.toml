[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whproxy"
version = "0.1.0"
description = "Warhammer miniature -> 4 cardinal views -> 3-colour printable volumetric proxy"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "rapidfuzz>=3.9",
  "numpy>=2.0",
  "Pillow>=10.0",
  "opencv-python-headless>=4.10",
  "scipy>=1.13",
  "scikit-image>=0.24",
  "trimesh>=4.4",
  "plotly>=5.24",
  "playwright>=1.46",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
whproxy = "whproxy.cli:main"

[tool.setuptools]
packages = ["whproxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
